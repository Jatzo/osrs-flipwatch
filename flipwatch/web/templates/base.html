<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} | Flipwatch</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body data-alert-check="{{ url_for('dashboard.check_alerts') }}" data-latest-alert="{{ latest_alert_id }}">
  <header class="site-header">
    <a class="brand" href="{{ url_for('dashboard.opportunities') }}">Flipwatch</a>
    <nav>
      {% set endpoint = request.endpoint or "" %}
      <a href="{{ url_for('dashboard.opportunities') }}"
         {% if endpoint == "dashboard.opportunities" %}aria-current="page"{% endif %}>Opportunities</a>
      <a href="{{ url_for('dashboard.watchlist') }}"
         {% if endpoint.startswith("dashboard.watch") %}aria-current="page"{% endif %}>Watchlist</a>
      <a href="{{ url_for('dashboard.backtests') }}"
         {% if endpoint.startswith("dashboard.backtest") %}aria-current="page"{% endif %}>Backtests</a>
      <a href="{{ url_for('dashboard.alerts') }}"
         {% if endpoint.startswith("dashboard.alerts") %}aria-current="page"{% endif %}>Alerts
        <span id="alert-count" class="badge" {% if not unread_alerts %}hidden{% endif %}>
          <span class="visually-hidden">unread: </span><span data-count>{{ unread_alerts }}</span>
        </span>
      </a>
    </nav>
    <form class="search" action="{{ url_for('dashboard.search') }}" method="get" role="search">
      <label class="visually-hidden" for="search-box">Find an item</label>
      <input id="search-box" name="q" type="search" placeholder="Find an item" value="{{ query or '' }}">
    </form>
  </header>

  <main>
    <div id="alert-banners" class="banners" aria-live="polite"></div>
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    Prices from the <a href="https://prices.runescape.wiki/">OSRS Wiki real-time prices API</a>.
    Not affiliated with Jagex.
  </footer>
  <script src="{{ url_for('static', filename='table.js') }}"></script>
  <script src="{{ url_for('static', filename='alerts.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
