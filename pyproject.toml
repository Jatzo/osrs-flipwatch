[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "osrs-flipwatch"
version = "0.1.0"
description = "Find, backtest and alert on Grand Exchange flips in Old School RuneScape."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
    "httpx>=0.28",
    "python-dotenv>=1.0",
]

[project.scripts]
flipwatch = "flipwatch.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "respx>=0.22",
    "ruff>=0.15",
]

[tool.setuptools.packages.find]
include = ["flipwatch*"]

[tool.setuptools.package-data]
"flipwatch.web" = ["templates/*.html", "static/*.css", "static/*.js", "static/vendor/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
